# niri lock screen. niri-lock starts it; plain `hyprlock` works too.
# gruvbox-dark, the same colours as ~/.config/swaylock/config.
#
# Why hyprlock and not swaylock: swaylock starts PAM only after Enter, and PAM
# asks pam_fprintd first — so unlocking took a password AND a finger. hyprlock
# reads the fingerprint and the password in parallel: EITHER one unlocks.

# niri-lock writes $wallpaper here (the image from ~/.fehbg) before each lock.
source = ~/.cache/hyprlock-wallpaper.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = false
}

auth {
    pam {
        enabled = true
        # Password only: /etc/pam.d/hyprlock-password (niri-pkg/pam.d/).
        # The stock `hyprlock` service includes login -> pam_fprintd.
        module = hyprlock-password
    }
    fingerprint {
        enabled = true
        ready_message = Touch the reader or type the password
        present_message = Reading finger…
        retry_delay = 250
    }
}

background {
    monitor =
    path = $wallpaper
    color = rgb(282828)
    # Dim + desaturate so the text stays legible, like the i3 lockscreen.
    blur_passes = 1
    blur_size = 2
    brightness = 0.6
    vibrancy = 0
    contrast = 0.9
}

label {
    monitor =
    text = $TIME
    color = rgb(ebdbb2)
    font_family = Ubuntu Mono
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 4
    dots_size = 0.25
    dots_spacing = 0.3
    outer_color = rgb(3c3836)
    inner_color = rgba(282828cc)
    font_color = rgb(ebdbb2)
    font_family = Ubuntu Mono
    check_color = rgb(458588)
    fail_color = rgb(cc241d)
    capslock_color = rgb(d65d0e)
    fade_on_empty = false
    placeholder_text = password or finger
    fail_text = $PAMFAIL ($ATTEMPTS)
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(a89984)
    font_family = Ubuntu Mono
    font_size = 16
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTFAIL
    color = rgb(fb4934)
    font_family = Ubuntu Mono
    font_size = 16
    position = 0, -110
    halign = center
    valign = center
}
