# Overrides /usr/share/xdg-desktop-portal/niri-portals.conf for the niri session.
# The system file sends FileChooser to the gnome backend, which opens the
# Nautilus picker from every "Upload" / "Save as" in Chrome and other apps. The
# gtk backend gives the GTK3 picker: same toolkit, theme, icons and bookmarks
# (~/.config/gtk-3.0/bookmarks) as Thunar. Thunar itself cannot act as a picker.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.FileChooser=gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
