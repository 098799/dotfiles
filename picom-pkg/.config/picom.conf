#############################################################################
# picom — i3 / gruvbox-dark desktop, AMD Radeon 890M, 2560x1440 @ 60Hz
#
# Rewritten 7 Sep 2026. The previous config (Feb 2024) had fading = false,
# no blur, no rounded corners and no animations, so picom was doing nothing
# visible beyond faint shadows that i3's tiling had nothing to cast onto.
#############################################################################

# --- Backend --------------------------------------------------------------
# glx, not xrender: dual_kawase blur and the animation scripts need it.
# Launch picom with no --backend flag or the command line wins over this.
backend = "glx";
vsync = true;

# Compositing must stay on for the focused window, otherwise a maximised
# terminal gets unredirected and loses every effect below (this is the main
# reason the old setup looked inert).
unredir-if-possible = false;

# radeonsi is happy without it and it costs latency on this driver.
xrender-sync-fence = false;

# --- Rounded corners ------------------------------------------------------
corner-radius = 10;
# NOTE: 'class_g = i3-frame' used to be in this list and did nothing. i3's
# frame windows really do carry WM_CLASS = i3-frame, but picom matches class_g
# against the CLIENT window inside the frame (Google-chrome, Alacritty, ...),
# so the rule never fired. Measured 7 Sep 2026: identical corners with and
# without it. Removed, so the list says what it does.
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3bar'",
    "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- Shadows --------------------------------------------------------------
# Large, soft and centred rather than a hard 5px drop, so the i3 gaps below
# read as depth instead of as a smudge.
shadow = true;
shadow-radius = 24;
shadow-opacity = 0.55;
shadow-offset-x = -24;
shadow-offset-y = -20;
shadow-color = "#000000";
shadow-exclude = [
    "! name~=''",
    "name = 'Notification'",
    "name = 'Plank'",
    "name = 'Docky'",
    "name = 'Kupfer'",
    "name = 'xfce4-notifyd'",
    "name *= 'VLC'",
    "name *= 'compton'",
    "name *= 'picom'",
    "class_g = 'Conky'",
    "class_g = 'Kupfer'",
    "class_g = 'Synapse'",
    "class_g ?= 'Notify-osd'",
    "class_g ?= 'Cairo-dock'",
    "class_g ?= 'Xfce4-notifyd'",
    "class_g ?= 'Xfce4-power-manager'",
    "class_g ?= 'i3-frame'",
    "_GTK_FRAME_EXTENTS@",
    "_NET_WM_STATE@ *= '_NET_WM_STATE_HIDDEN'",
    "_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'"
];
shadow-ignore-shaped = false;

# --- Blur -----------------------------------------------------------------
# Applies wherever a window is actually translucent. Alacritty is opaque, so
# this shows up behind menus, dunst and anything you make see-through later.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'i3bar'",
    "_GTK_FRAME_EXTENTS@"
];

# --- Opacity --------------------------------------------------------------
# Work surfaces stay fully opaque — text legibility beats the effect. Only
# transient chrome is softened.
inactive-opacity = 1;
active-opacity = 1;
frame-opacity = 1;
inactive-opacity-override = false;
detect-client-opacity = true;

# Translucency. Only surfaces that gain from it: terminals, the launcher and
# notifications. Everything else stays fully opaque, because text on a blurred
# photograph is harder to read, not prettier.
#
# The focused terminal is less transparent than the unfocused ones, so the
# active window is obvious even before you look at the border colour.
opacity-rule = [
    "94:class_g = 'Alacritty' && focused",
    "86:class_g = 'Alacritty' && !focused",
    "92:class_g = 'Dmenu'",
    "92:class_g = 'dmenu'",
    "95:class_g = 'Rofi'",
    "95:class_g = 'Dunst'",
    "100:class_g = 'Alacritty' && _NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'",
    "100:_NET_WM_STATE@ *= '_NET_WM_STATE_FULLSCREEN'"
];

# --- Fading ---------------------------------------------------------------
# ~110ms at 60Hz. Covers workspace switches, which animations do not.
fading = true;
fade-delta = 6;
fade-in-step = 0.09;
fade-out-step = 0.09;
fade-exclude = [ ];

# --- Animations -----------------------------------------------------------
animations = (
    {
        triggers = [ "open", "show" ];
        preset = "appear";
        duration = 0.22;
        scale = 0.92;
    },
    {
        triggers = [ "close", "hide" ];
        preset = "disappear";
        duration = 0.18;
        scale = 0.92;
    },
    {
        triggers = [ "geometry" ];
        preset = "geometry-change";
        duration = 0.2;
    }
);

# --- Focus / window detection --------------------------------------------
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-transient = true;
detect-client-leader = true;
focus-exclude = [ "class_g = 'Cairo-clock'" ];

wintypes :
{
  tooltip      : { fade = true; shadow = false; opacity = 0.9; focus = true; };
  dock         : { shadow = false; };
  dnd          : { shadow = false; };
  popup_menu   : { opacity = 0.95; };
  dropdown_menu: { opacity = 0.95; };
  fullscreen   : { fade = true; shadow = false; opacity = 1; focus = true; };
};
