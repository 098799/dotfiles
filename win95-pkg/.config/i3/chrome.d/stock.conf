# Stock window chrome — your normal borderless-ish i3 look. Linked to
# ~/.config/i3/active-chrome.conf by `w95 off`.
#
# This restates what the main config sets rather than staying empty, because
# the win95 file it replaces used `for_window` to reborder live windows, and
# only an equally explicit rule puts them back.
#
# Keep the width in step with `default_border` in the main i3 config: this file
# is the LAST include, and its `for_window` catch-all beats anything set above,
# so whatever stands here is the border width you actually get. It said 10 long
# after the main config went to 4, which is why the 4px change never showed.
#
# 10px also broke tabbed and stacked containers. There i3 places the client
# flush with the top of the content area (`window_rect.y == 0`) while still
# painting the top border band over it, so a 10px border ate the top third of
# the terminal's first text row. A split container insets the client by the
# border width instead, so the same border looks fine there. At 4px the band
# only covers the cell's leading and the first line stays legible.

default_border pixel 4
default_floating_border normal

for_window [class=".*"] border pixel 4
