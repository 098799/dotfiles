# Stock window chrome — your normal borderless-ish i3 look. Linked to
# ~/.config/i3/active-chrome.conf by `w95 off`.
#
# This restates what the main config sets rather than staying empty, because
# the win95 file it replaces used `for_window` to reborder live windows, and
# only an equally explicit rule puts them back.

default_border pixel 10
default_floating_border normal

for_window [class=".*"] border pixel 10
