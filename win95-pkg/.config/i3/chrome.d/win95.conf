# Win95 window chrome. Linked to ~/.config/i3/active-chrome.conf by `w95 on`.
#
# i3-95 paints its gradient caption and [_][□][X] buttons into the decoration
# i3 already draws — so with `default_border pixel N` there is no decoration
# to paint into and no title anywhere on screen. Windows 95 mode therefore
# needs `border normal`, and this file has to be included at the *end* of the
# config to beat the default_border set higher up in it.

# Deco height follows the title font, so this is also the caption-bar size.
font pango:W95FA 13

default_border normal 4
default_floating_border normal 4
title_align left

# default_border only applies to windows opened from now on; this catches the
# ones already on screen when the theme is switched.
for_window [class=".*"] border normal 4
