# ── Windows 95, as a palette `theme` understands ──────────────────────
# `theme <mode> <palette>` reads ~/.config/i3/colors.d/$palette-$mode.conf and
# scrapes its `set $name value` lines into one semantic table, which every
# hex-driven consumer is generated from: dunst, rofi, tmux, fzf, and the i3
# client.* colours. Without this file those all kept whatever gruvbox or
# selenized left behind, so entering Windows 95 gave you a Win95 desktop with
# a gruvbox rofi menu and a gruvbox notification popup.
#
# So the mapping below is the whole point: it says what Win95's five colours
# mean in the semantic terms the rest of the switcher speaks.
#
#   face #c0c0c0 is a *background* -- it is what every dialog, button and
#   toolbar is made of, so it becomes bg_main rather than a foreground.
#   navy #000080 is the accent, because in Win95 navy is precisely "the
#   selected thing": title bars, list selections, highlighted menu items.
#
# Foregrounds are black, not white: everything here sits on silver, and the
# white-on-navy pairing only applies where navy is the background (accent_fg).

set $bg_main    #c0c0c0
set $bg_alt     #dfdfdf
set $title_fg   #000000
set $fg_main    #000000
set $fg_dim     #808080
set $sep        #808080
set $accent     #000080
set $accent_fg  #ffffff
set $info       #008080
set $info_fg    #ffffff
set $indicator  #800080
set $urgent     #800000
set $urgent_fg  #ffffff
set $warn       #808000
set $warn_fg    #000000

# The i3 side proper -- client.* rules, the teal root, the taskbar and the
# desktop icons -- lives in win95.conf and is pulled in rather than copied, so
# there is one definition of the Win95 window colours, not two that drift.
include ~/.config/i3/colors.d/win95.conf
