# ── Windows 95 ────────────────────────────────────────────────────────
# Palette for i3, matching win95-pkg's taskbar and Chicago95 GTK theme.
#
# The whole look is five colours. Everything below is one of them.
#
#   #c0c0c0  face      window chrome, the taskbar, every button
#   #ffffff  hilite    top/left of a raised edge
#   #808080  shadow    bottom/right of a raised edge, inactive titlebar
#   #000080  navy      the active title bar
#   #008080  teal      the desktop
#
# i3 draws flat borders, so the 3D bevel lives in the taskbar (GTK, which
# can do inset shadows) and in i3-95 if you build the patched WM.
# Plain i3 still reads correctly: grey frames, navy active title.

set $face      #c0c0c0
set $hilite    #ffffff
set $light     #dfdfdf
set $shadow    #808080
set $dkshadow  #000000
set $navy      #000080
set $navy_lt   #1084d0
set $teal      #008080
set $maroon    #800000

# Titlebar text: white on navy when focused, silver on grey when not —
# straight out of the Win95 default "Windows Standard" scheme. (The title
# font and border style live in chrome.d/win95.conf, which is included last
# so it can beat the main config's default_border.)

#                        border    background  text      indicator  child_border
client.focused           $face     $navy       $hilite   $navy_lt   $face
client.focused_inactive  $face     $shadow     $light    $shadow    $face
client.unfocused         $face     $shadow     $light    $shadow    $face
client.urgent            $face     $maroon     $hilite   $maroon    $maroon
client.placeholder       $face     $shadow     $light    $shadow    $face
client.background        $teal

hide_edge_borders none

# i3 4.22+ can draw the client's own icon in the titlebar — which is
# exactly the Win95 control-box position.
for_window [all] title_window_icon padding 3

# No gaps. Win95 windows touch.
gaps inner 0
gaps outer 0

# Teal desktop + the taskbar. exec_always so a reload restarts them.
exec_always --no-startup-id xsetroot -solid "#008080"
exec_always --no-startup-id ~/.local/bin/w95-restart-bar
# The icons. xsetroot's teal still goes down first: w95-desktop is an
# override-redirect window the WM never manages, so if it dies the root colour
# is what is left behind rather than whatever was underneath.
exec_always --no-startup-id ~/.local/bin/w95-restart-desktop

# i3bar is replaced by w95bar (Start button, task list, tray clock),
# so there is deliberately no bar {} block here.
