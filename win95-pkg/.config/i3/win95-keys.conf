# ── Windows 95 keybindings: NOT USED ──────────────────────────────────
#
# Kept for reference only. Nothing here is active and `w95-switch` does not
# link it — ~/.config/i3/active-keys.conf stays pointed at no-keys.conf.
#
# The reason is not collision management, it is preference: ten years of i3
# muscle memory is worth more than period accuracy, and a 95 skin is not a
# reason to relearn a single chord. The Start menu is a click on Start; the
# taskbar buttons raise and minimise; everything else stays exactly as it has
# always been.
#
# Also worth knowing if you ever reconsider: an i3 include can only ADD
# bindings. Per the userguide, "included files can only add to the
# configuration... you can only add new key bindings, not overwrite or remove
# existing key bindings", and a duplicate is a fatal config error rather than
# a silent override. So this file could never have quietly taken a key — it
# would simply have refused to parse.
#
#   bindsym Control+Escape exec --no-startup-id pkill -USR1 -f 'bin/w95bar'
#   bindsym Mod1+Tab       focus next sibling
#   bindsym Mod1+Shift+Tab focus prev sibling
#   bindsym Control+Mod1+Delete exec --no-startup-id rofi -show window
#   bindsym Mod4+Shift+d exec --no-startup-id w95-show-desktop
#   bindsym Mod4+F1 exec --no-startup-id i3-sensible-terminal -e man i3
#   bindsym Mod4+e exec --no-startup-id xdg-open ~        # collides: $mod+e
#   bindsym Mod4+r exec --no-startup-id w95-run           # collides: $mod+r
#   bindsym Mod4+m move scratchpad                        # collides: $mod+m
